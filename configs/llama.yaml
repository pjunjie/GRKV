model: llama
method: default
budgets:
- 10
- 20
seed: 42
query_aware: false
model_dtype: bfloat16
attention: flash_attention_2
max_context_length_policy: min(tokenizer.model_max_length, int(1e10))
press:
  compression_ratio: 0.9
  window_size: 32
  kernel_size: 5
  grkv_guard: 0.1
  critical_alpha_safeguard: 0.2
  critical_epsilon: 0.0001
  critical_first_stage_ratio: 0.5
  fit_config:
    objective: pre
    steps: 1
    ridge: 0.01
    relative_cap: 0.1
    max_iterations: 16
    tolerance: 1.0e-06
    precision: float32
    key_relative_cap: 0.025
    query_sampling: context_stratified
    query_count: 32
  audit: true
  query_aware: false
