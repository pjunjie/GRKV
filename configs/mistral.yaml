model: mistral
method: candidate
budgets:
- 10
- 20
seed: 42
query_aware: false
model_dtype: bfloat16
attention: flash_attention_2
max_context_length_policy: min(tokenizer.model_max_length, int(1e10))
press:
  compression_ratio: 0.9
  window_size: 32
  kernel_size: 5
  grkv_guard: 0.0
  grkv_key_lambda: 0.01
  grkv_value_lambda: 0.01
  grkv_num_steps: 1
  grkv_tol: 1.0e-09
  behavior_probe_windows: 9
  behavior_probes_per_window: 2
  behavior_relative_margin: 0.0
  mode: none
  critical_alpha_safeguard: 0.2
  critical_epsilon: 0.0001
  critical_first_stage_ratio: 0.5
  fit_config:
    objective: pre
    steps: 1
    ridge: 0.01
    relative_cap: 0.1
    max_iterations: 16
    tolerance: 1.0e-06
    precision: float32
    key_relative_cap: 0.025
    query_sampling: context_stratified
    query_count: 32
  audit: true
  query_aware: false
  reference_check: false
  validate_queries: false
